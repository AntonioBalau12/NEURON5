<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI AGENT ARENA</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Typography Styles -->
    <style>
      @font-face {
        font-family: 'Creato Display';
        src: url('./fonts/CreatoDisplay-Black.otf') format('opentype');
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Creato Display';
        src: url('./fonts/CreatoDisplay-Bold.otf') format('opentype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Creato Display';
        src: url('./fonts/CreatoDisplay-Medium.otf') format('opentype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Creato Display';
        src: url('./fonts/CreatoDisplay-Regular.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Figtree';
        src: url('./fonts/Figtree-Variable.ttf') format('truetype');
        font-weight: 300 900;
        font-style: normal;
        font-display: swap;
      }

      /* Design System Tokens */
      :root {
        --white-100: #fcfcfc;
        --white-0-6: rgba(255, 255, 255, 0.6);
        --black-100: #202020;
        --black-0-7: rgba(0, 0, 0, 0.7);
        --primary-100: #1d6dd7;
        /* QA DNA Electric Royal Blue */
        --primary-200: #2859b5;
        /* QA DNA Sapphire Blue */
        --accent: #d7f13b;

        --font-display: 'Creato Display', 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-body: 'Figtree', 'Creato Display', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--white-100);
        color: var(--black-100);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
      }

      /* Background Dot Grid Pattern */
      .dot-grid {
        position: absolute;
        inset: 0;
        background-image: url('./dot-grid.svg');
        background-repeat: repeat;
        background-size: 48px 48px;
        opacity: 0.55;
        pointer-events: none;
        z-index: 0;
      }

      /* Top Left Header (NEURON5 Branding) */
      .top-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 2.25rem 4vw;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        z-index: 100;
      }

      .brand-logo {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        font-family: var(--font-display);
        font-size: 1.875rem;
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1;
        cursor: default;
      }

      .brand-logo .brand-text {
        color: var(--black-100);
      }

      .brand-logo .brand-number {
        color: var(--primary-100);
        margin-left: 1px;
      }

      /* Centered Hero Stage */
      .hero-stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1;
        padding: 0 1.5rem;
      }

      .hero-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: translateY(-8vh);
        z-index: 5;
      }

      .hero-title {
        font-family: var(--font-display);
        font-size: clamp(2.25rem, 5.5vw, 4.35rem);
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.025em;
        text-transform: uppercase;
        color: var(--black-100);
        max-width: 90vw;
      }

      .hero-title .title-line {
        display: block;
      }

      .hero-subtitle {
        margin-top: 1.5rem;
        font-family: var(--font-body);
        font-size: 1.125rem;
        font-weight: 500;
        color: var(--black-0-7);
        letter-spacing: -0.01em;
      }

      /* Mascot Stage (Gorilla Peeking from Bottom) */
      .hero-mascot-wrapper {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(440px, 45vw);
        max-height: 42vh;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        z-index: 10;
        overflow: visible;
        pointer-events: auto;
      }

      .hero-mascot-canvas-container {
        width: 100%;
        aspect-ratio: 1;
        position: relative;
        /* Position so only forehead/eyes/sunglasses/nose peek over the bottom edge */
        margin-bottom: -13.5%;
        cursor: default;
      }

      #mascot-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      @media (max-width: 768px) {
        .top-header {
          padding: 1.5rem 5vw;
        }

        .brand-logo {
          font-size: 1.5rem;
        }

        .hero-content {
          transform: translateY(-10vh);
        }

        .hero-title {
          font-size: clamp(1.85rem, 8vw, 2.75rem);
        }

        .hero-subtitle {
          font-size: 1rem;
          margin-top: 1rem;
        }

        .hero-mascot-wrapper {
          width: min(340px, 80vw);
          max-height: 38vh;
        }

        .hero-mascot-canvas-container {
          margin-bottom: -15.5%;
        }
      }
    </style>

    <!-- Local Mascot Data & Rive Canvas Runtime -->
    <script src="./mascot-asset.js"></script>
    <script src="./rive.min.js"></script>
</head>

<body>

  <!-- Subtle Dot Grid Background Pattern -->
  <div class="dot-grid"></div>

  <!-- Header with NEURON5 Branding (Top-Left) -->
  <header class="top-header">
    <a href="#" class="brand-logo" aria-label="NEURON5">
      <span class="brand-text">NEURON</span><span class="brand-number">5</span>
    </a>
  </header>

  <!-- Main Hero Stage -->
  <main class="hero-stage">

    <!-- Title & Subtitle -->
    <div class="hero-content">
      <h1 class="hero-title">
        <span class="title-line">AI AGENT ARENA</span>
        <span class="title-line">POWERED BY NEURON5</span>
      </h1>
      <p class="hero-subtitle">Coming soon.</p>
    </div>

    <!-- Blue Mascot (QA DNA Gorilla) -->
    <div class="hero-mascot-wrapper">
      <div class="hero-mascot-canvas-container" id="mascot-container">
        <canvas id="mascot-canvas"></canvas>
      </div>
    </div>

  </main>

  <!-- Mascot Rive Runtime & Proximity Tracker -->
  <script>
    (function initMascot() {
      const canvas = document.getElementById('mascot-canvas');
      const container = document.getElementById('mascot-container');
      if (!canvas || typeof rive === 'undefined') return;

      // Decode local base64 buffer for 100% offline, zero-CORS reliability
      let buffer = null;
      if (window.__GORILLA_RIV_BASE64__) {
        try {
          const binaryString = atob(window.__GORILLA_RIV_BASE64__);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          buffer = bytes.buffer;
        } catch (e) {
          console.warn('Base64 decode failed, falling back to file URL:', e);
        }
      }

      const riveConfig = {
        canvas: canvas,
        artboard: 'Cut Long',
        stateMachines: 'State Machine 1',
        autoplay: true,
        automaticallyHandleEvents: true,
        isTouchScrollEnabled: true,
        layout: new rive.Layout({
          fit: rive.Fit.Contain,
          alignment: rive.Alignment.BottomCenter
        }),
        onLoad: () => {
          riveInstance.resizeDrawingSurfaceToCanvas();
        }
      };

      if (buffer) {
        riveConfig.buffer = buffer;
      } else {
        riveConfig.src = './gorilla.riv';
      }

      const riveInstance = new rive.Rive(riveConfig);

      // Handle window resize
      window.addEventListener('resize', () => {
        if (riveInstance) {
          riveInstance.resizeDrawingSurfaceToCanvas();
        }
      });

      // Proximity & Cursor Tracker Forwarder
      // Enables smooth eye follow and glasses lift when moving cursor over the viewport
      let raf = 0;
      let lastX = 0;
      let lastY = 0;

      function dispatchPointer(x, y) {
        const rect = canvas.getBoundingClientRect();

        // Dispatch synthetic pointermove to canvas so Rive state machine receives cursor position
        canvas.dispatchEvent(new PointerEvent('pointermove', {
          clientX: x,
          clientY: y,
          bubbles: true
        }));
      }

      window.addEventListener('mousemove', (e) => {
        lastX = e.clientX;
        lastY = e.clientY;
        if (!raf) {
          raf = requestAnimationFrame(() => {
            dispatchPointer(lastX, lastY);
            raf = 0;
          });
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches[0]) {
          dispatchPointer(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

    })();
  </script>
</body>

</html>
