<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rive Mascot Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@latest/rive.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #fcfcfc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
    }
    .mascot-container {
      width: 400px;
      height: 400px;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="mascot-container">
    <canvas id="mascot-canvas"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('mascot-canvas');
    const r = new rive.Rive({
      src: 'gorilla.riv',
      canvas: canvas,
      artboard: 'Cut Long',
      stateMachines: 'State Machine 1',
      autoplay: true,
      layout: new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.BottomCenter
      }),
      onLoad: () => {
        console.log('Rive loaded!');
        r.resizeDrawingSurfaceToCanvas();
        const smInputs = r.stateMachineInputs('State Machine 1');
        console.log('State Machine Inputs:', smInputs.map(i => ({ name: i.name, type: i.type, value: i.value })));
      }
    });

    // Forward mousemove to canvas so mascot tracks cursor everywhere in viewport
    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX;
      const clientY = e.clientY;
      
      // Dispatch synthetic pointermove to canvas
      canvas.dispatchEvent(new PointerEvent('pointermove', {
        clientX: clientX,
        clientY: clientY,
        bubbles: true
      }));
    });
  </script>
</body>
</html>
